<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <title>Log In</title>
</head>
<body>
  <form class="Log-In">
    <h1>Sign In</h1>
    <div class="login-input">
      <input class="li-username" placeholder="Username" type="text" maxlength="20" required>
      <input class="li-password" placeholder="Password" type="password" maxlength="30" required>
    </div>
    <div class="Remember-Forgot">
      <input class="rm" id="rm" type="checkbox">
      <label for="rm" class="ls"><span>Remember me</span></label>
      <a href="#" class="fg">Forgot Password?</a>
    </div>
    <button class="login-btn" type="submit">Submit</button>
    <p class="dhac">Don't have an account? <a class="reg" href="#">Register</a></p>
  </form>
</body>
</html>
